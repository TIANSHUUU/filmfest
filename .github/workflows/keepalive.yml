# ─────────────────────────────────────────────────────────────────────────────
# 放到 filmfest 仓库的 .github/workflows/keepalive.yml
#
# 为什么有这个文件
#
# Supabase 免费档：**项目 7 天没有任何活动就自动暂停**。2026-11-02 这个项目
# 和家庭账单那个一起被暂停了（90 天没人碰），片单和观看记录看起来像是全没了
# ——其实数据一条没丢（88 部电影 / 10 个片单 / 25 条投票都在），只是请求失败
# 被页面渲染成了空列表。
#
# 两个 Supabase 项目是**独立的**，各自暂停、各自恢复，所以两个仓库都要有这个
# 任务，一份管不了两个。household_exp 仓库里有一份对应的。
# ─────────────────────────────────────────────────────────────────────────────

name: keepalive

on:
  schedule:
    # 每周二、周五 03:41 UTC。
    #
    # **故意不是每周一次**：暂停线就是 7 天，而 GitHub 的定时任务在高峰期会
    # 被延迟甚至跳过（官方明说不保证准点），卡着 7 天跑等于赌运气，跳过一次
    # 就暂停了。一周两次留 3–4 天余量。分钟数避开整点，整点最拥堵。
    #
    # 和 household_exp 那个错开一天，纯粹是别让两个仓库挤在同一时刻。
    - cron: '41 3 * * 2,5'
  workflow_dispatch:        # Actions 页面可以手动点一次，用来验证

permissions:
  contents: write           # 心跳那步要推 keepalive 分支

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 查一次数据库
        env:
          # 复用 deploy.yml 已经配好的那两个 secret，不用新建任何东西。
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          # ⚠️ 必须真的查一张表。/auth/v1/health 只摸到网关、不碰 Postgres，
          #    用它 ping 等于没 ping——项目照样会被判定为不活跃。
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
                   -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                   "$URL/rest/v1/films?select=id&limit=1") || code=000
          echo "HTTP $code"

          # 失败就让整个 workflow 红掉。GitHub 会发邮件——免费的早期预警，
          # 比几个月后自己发现片单打不开强得多。
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 没有正常响应（HTTP $code）。多半是又被暂停了，去 https://supabase.com/dashboard 看一眼。注意 DNS 能解析不等于项目活着——暂停时域名会落到 Cloudflare 边缘 IP，真实请求返回 521。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: 心跳提交（让 GitHub 的定时器也别睡）
        run: |
          set -eu
          # ⚠️ 第二个坑：**GitHub 会把「超过 60 天没有仓库活动」的定时任务
          #    自动停用。** 而这个任务存在的全部意义就是应付「几个月没人碰」，
          #    不做这步它会在最需要它的时候先自己死掉，两层保护一起失效。
          #
          #   · 推到独立的 keepalive 分支，不污染 main 的历史
          #   · 每次全新 orphan 分支 + 强推，那个分支永远只有一个提交
          #   · 用 GITHUB_TOKEN 推送**不会**触发其他 workflow（GitHub 刻意的
          #     防循环设计），所以不会把 deploy.yml 带起来重新部署
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 每次都是全新 runner，keepalive-tmp 不该存在；加这行纯粹是让本地
          # 重放和手动重跑也不会炸（实测不加的话第二次直接 fatal）。
          git branch -D keepalive-tmp 2>/dev/null || true
          git checkout --orphan keepalive-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-ping.txt
          git add -f last-ping.txt
          git commit -m "keepalive $(date -u +%F)"
          git push -f origin keepalive-tmp:keepalive
