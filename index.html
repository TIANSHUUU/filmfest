<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 不要被搜索引擎收录。三张表的 RLS 一直是 using(true)，数据对全网可读可写，
         「没人知道这个网址」是仅剩的一层遮挡。故意不配 robots.txt：这是项目页，
         robots.txt 只有在域名根目录才算数，而且 Disallow 会让爬虫看不到这行 noindex。 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Tapasta电影节</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Ma+Shan+Zheng&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
